# Render Blueprint: free web service. Database is Neon (free), passed as DATABASE_URL.
services:
  - type: web
    name: topfornow
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PAYMENT_MODE
        value: sandbox
      - key: TRUST_PROXY
        value: "true"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste Neon's direct (non-pooler) connection string
      - key: ADMIN_USERNAME
        value: owner
      - key: OWNER_TZ
        value: Asia/Kolkata
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false   # e.g. https://topfornow.onrender.com
