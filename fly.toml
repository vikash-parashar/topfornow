# Fly.io config. Secrets are set with `fly secrets set`, never here.
app = "topfornow"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  TRUST_PROXY = "true"
  PAYMENT_MODE = "sandbox"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
